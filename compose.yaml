
services:
  mongodb:
    image: mongo:8
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  api:
    build: ./api
    ports:
      - "4000:4000"
    environment:
      MONGO_URL: mongodb://mongodb:27017/tempo
    depends_on:
      mongodb:
        condition: service_healthy
  
  web:
    build: ./web
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  mongo-data:
    external: true
